name: Release

# F-Droid rebuilds this APK from the tagged source and compares it byte for byte
# against the file attached here. If the two differ, F-Droid cannot ship the
# upstream signature and the app silently stops updating there. So this job
# builds exactly the way ci.yml does, JDK 21 Temurin and the Gradle wrapper from
# the repo, because that combination is the one that was verified to reproduce.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build, sign and attach the APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build the release APK
        run: ./gradlew assembleRelease

      # Printed on every run, a manual one included. It is the only way to see
      # that this environment still produces the bytes F-Droid produces without
      # waiting for a release to fail verification months from now.
      - name: Checksum of the unsigned APK
        run: sha256sum app/build/outputs/apk/release/app-release-unsigned.apk

      # The key is the permanent identity of the app on F-Droid. Losing it means
      # no more updates for anyone who installed from there, so it lives in the
      # login keychain on the workstation and only as a secret here.
      - name: Sign and attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.NONIUS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NONIUS_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cp app/build/outputs/apk/release/app-release-unsigned.apk "nonius-$version.apk"
          # Both flags are what makes the signature copyable. F-Droid lifts the
          # signing block off this file and puts it on its own build, so the zip
          # underneath has to stay exactly as Gradle wrote it. Without
          # --v1-signing-enabled false apksigner adds three META-INF entries and
          # moves everything after them; without --alignment-preserved true it
          # re-aligns three more. minSdk is 36, so v1 signing buys nothing.
          "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias nonius \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled false --alignment-preserved true \
            "nonius-$version.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          gh release upload "$GITHUB_REF_NAME" "nonius-$version.apk" --clobber
