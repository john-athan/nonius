version: 2

# One pull request for everything: Gradle dependencies and GitHub Actions land
# together in a single branch through a multi-ecosystem group.
multi-ecosystem-groups:
  all-updates:
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Europe/Berlin"

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    multi-ecosystem-group: "all-updates"
    patterns:
      - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all-updates"
    patterns:
      - "*"
