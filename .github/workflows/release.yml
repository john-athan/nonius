name: Release

# This job builds the release APK the way F-Droid does, JDK 21 Temurin and the
# Gradle wrapper from the repo, and prints its checksum, so a drifting build
# environment shows up here before it shows up in an F-Droid build.
#
# Whether the APK is also signed here is the upstream_signing var of this
# project in oss-kit's fleet.json. Without it there is no signing step: F-Droid
# builds from the tag and signs with its own key (its metadata has no Binaries
# line and no AllowedAPKSigningKeys), and a self-signed APK attached here would
# only create a second identity for the app.
#
# With it, F-Droid rebuilds this APK from the tagged source and compares it byte
# for byte against the file attached here. If the two differ, F-Droid cannot
# ship the upstream signature and the app silently stops updating there. So the
# build has to be exactly the one ci.yml does, because that combination is the
# one that was verified to reproduce.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Release APK
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the release APK
        run: ./gradlew assembleRelease

      # Printed on every run, a manual one included. It is the only way to see
      # that this environment still produces the bytes F-Droid produces without
      # waiting for a release to fail verification months from now.
      - name: Checksum of the unsigned APK
        run: sha256sum app/build/outputs/apk/release/app-release-unsigned.apk

      # The key is the permanent identity of the app on F-Droid. Losing it means
      # no more updates for anyone who installed from there, so it lives in the
      # login keychain on the workstation and only as a secret here.
      - name: Sign and attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.NONIUS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NONIUS_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cp app/build/outputs/apk/release/app-release-unsigned.apk "nonius-$version.apk"
          # Both flags are what makes the signature copyable. F-Droid lifts the
          # signing block off this file and puts it on its own build, so the zip
          # underneath has to stay exactly as Gradle wrote it. Without
          # --v1-signing-enabled false apksigner adds three META-INF entries and
          # moves everything after them; without --alignment-preserved true it
          # re-aligns three more. minSdk is 36, so v1 signing buys nothing.
          "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias nonius \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled false --alignment-preserved true \
            "nonius-$version.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          gh release upload "$GITHUB_REF_NAME" "nonius-$version.apk" --clobber
